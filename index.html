<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polish Cards — Import Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:700px;margin:auto;padding:24px;line-height:1.5;background:#f7f7f5;color:#222}
.box{background:white;border:1px solid #ddd;border-radius:16px;padding:20px}
button,label{display:inline-block;padding:12px 16px;border-radius:10px;font:inherit}
label{background:#222;color:white;cursor:pointer}
input{display:none}
#status{margin-top:16px;padding:12px;background:#f1f1ee;border-radius:10px}
#output{margin-top:16px;white-space:pre-wrap;word-break:break-word;background:#fafafa;border:1px solid #ddd;border-radius:10px;padding:12px;min-height:80px}
</style>
</head>
<body>
<div class="box">
<h1>Polish Cards — тест импорта</h1>
<p>Пока проверяем только одну вещь: может ли Safari на iPhone загрузить TXT-файл.</p>
<label>
  Выбрать TXT-файл
  <input id="file" type="file" accept=".txt,text/plain">
</label>
<div id="status">Файл ещё не выбран.</div>
<div id="output"></div>
</div>

<script>
const fileInput=document.getElementById('file');
const status=document.getElementById('status');
const output=document.getElementById('output');

fileInput.addEventListener('change', async function(){
  const file=this.files && this.files[0];
  if(!file){
    status.textContent='Файл не выбран.';
    return;
  }
  status.textContent='Файл выбран: '+file.name+' ('+file.size+' байт). Читаю…';
  try{
    const text=await file.text();
    status.textContent='УСПЕХ. Прочитано символов: '+text.length;
    output.textContent=text;
  }catch(e){
    status.textContent='ОШИБКА: '+e.message;
  }
});
</script>
</body>
</html>
