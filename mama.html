<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2d2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mama">
<title>Mama · проверка дел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2f2;--text:#201f1d;--muted:#605d5d;--line:color-mix(in srgb,#201f1d 16%,transparent);--gold:#b68235;--gold2:#7d5411;--ok:#3d7a4a;--no:#8b1e2b;--card:#fbf8f1;
 --head:"Cormorant Garamond",Georgia,serif;--body:"Lora",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e4e1dc;color:var(--text);font:15px/1.5 var(--body)}
main{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding:calc(env(safe-area-inset-top) + 18px) 20px 40px}
h1{font:400 36px/1 var(--head);margin:0 0 4px}
h2{font:600 22px var(--head);margin:26px 0 4px}
h3{font:600 13px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}
.lead{color:var(--muted);font-size:14px;margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--gold);color:var(--gold2);background:transparent;border-radius:4px;padding:8px 14px;font:600 16px var(--head)}
.btn.main{width:100%;padding:12px;font-size:19px;border-radius:999px;background:var(--card)}
.btn.no{border-color:var(--no);color:var(--no)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font:600 18px/1.2 var(--head)}
.row .nm small{color:var(--muted);font-size:12px}
.row.new .nm b::after{content:" •";color:var(--gold)}
.row.rej .nm b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--no)}
.tag{font-size:12px;color:var(--ok)}.row.rej .tag{color:var(--no)}
.tabs{display:flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden;margin:14px 0 4px}
.tabs button{flex:1;border:0;background:none;padding:9px;font:600 17px var(--head);color:var(--gold2)}
.tabs button.on{background:#facb8d;color:#2d2b2b}
.empty{padding:12px 14px;border:1px dashed var(--line);border-radius:4px;color:var(--muted)}
input{width:100%;padding:11px 12px;border:1px solid #d7d3d3;border-radius:4px;background:var(--card);font-size:16px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2d2b2b;color:#ffe3bf;padding:10px 18px;border-radius:999px;font:600 16px var(--head)}
</style>
</head>
<body>
<main id="app"><p class="lead">Загружаю…</p></main>
<script>
// Страница для мамы: отметки дел за неделю. Дело засчитывается сразу; отклонённое (столбец «Мама» = отклонено) не считается.
// Ключ передаётся один раз в ссылке (#key=…) и дальше хранится на этом телефоне.
const API='https://script.google.com/macros/s/AKfycbzwBSGNbH8aw9kqsn77o2_fJJJQvZAGXoIwdw_wZ92_9wKNS-Te5yt1x8AbfM9t_EwF_w/exec';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
let key=null,data=null,kid=null;
try{const h=new URLSearchParams(location.hash.slice(1)).get('key');if(h){localStorage.setItem('mama_key',h);history.replaceState(null,'',location.pathname)}key=localStorage.getItem('mama_key')}catch(e){}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

function askKey(msg){
 app.innerHTML=`<h1>Mama</h1><p class="lead">${esc(msg||'Введи ключ из инструкции. Он сохранится на этом телефоне.')}</p>
  <form id="kf"><input id="k" autocomplete="off" placeholder="Ключ"><button class="btn main">Открыть</button></form>`;
 document.getElementById('kf').onsubmit=e=>{e.preventDefault();key=document.getElementById('k').value.trim();try{localStorage.setItem('mama_key',key)}catch(x){}load()};
}
async function load(){
 if(!key)return askKey();
 try{
  const r=await fetch(API+'?'+new URLSearchParams({action:'mama',key}));
  const d=await r.json();
  if(d.error==='Нет доступа'){try{localStorage.removeItem('mama_key')}catch(x){}key=null;return askKey('Ключ не подошёл. Попробуй ещё раз.')}
  if(d.error||!d.marks)throw new Error(d.error||'Скрипт ещё старый: вставь код из инструкции и опубликуй новую версию.');
  data=d;if(!kid)kid=(d.kids[0]||{}).id;render();
 }catch(e){app.innerHTML=`<h1>Mama</h1><p class="lead">Не получилось загрузить. ${esc(e.message)}</p><button class="btn" onclick="load()">Ещё раз</button>`}
}
// одна строка списка = дело ребёнка за день; итог по отметкам этого дня (включил/выключил)
function items(){
 const g={};
 data.marks.filter(m=>m.kid===kid).forEach(m=>{
  const k=m.choreId+'|'+m.day;
  const it=g[k]||(g[k]={choreId:m.choreId,name:m.name,day:m.day,time:m.time,rows:[],net:0,rejected:false,unchecked:false});
  it.rows.push(m);it.time=m.time;
  if(m.done&&m.verdict==='отклонено')it.rejected=true;
  else it.net+=m.done?1:-1;
  if(m.done&&!m.verdict)it.unchecked=true;
 });
 return Object.values(g).filter(it=>it.net>0||it.rejected).sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:a.name.localeCompare(b.name));
}
function render(){
 const list=items(),days=[...new Set(list.map(i=>i.day))];
 const fresh=list.filter(i=>i.unchecked&&!i.rejected).length;
 app.innerHTML=`<h1>Mama</h1><p class="lead">Отметки дел с понедельника. Всё отмеченное уже засчитано. Отклони то, что не сделано.</p>
  <div class="tabs">${data.kids.map(k=>`<button data-kid="${esc(k.id)}" class="${k.id===kid?'on':''}">${esc(k.name)}</button>`).join('')}</div>
  ${fresh?`<p style="margin:14px 0 0"><button class="btn main" id="all">✦ Проверено, всё верно (${fresh}) ✦</button></p>`:''}
  ${days.map(d=>{const dt=new Date(d+'T12:00:00');return `<h3>${DOW[dt.getDay()]}, ${d.slice(8,10)}.${d.slice(5,7)}${d===data.today?' · сегодня':''}</h3>`+
   list.filter(i=>i.day===d).map(i=>`<div class="row ${i.rejected?'rej':''} ${i.unchecked&&!i.rejected?'new':''}"><div class="nm"><b>${esc(i.name)}</b><small>${esc(i.time)} · <span class="tag">${i.rejected?'отклонено':'засчитано'}</span></small></div>
    ${i.rejected?`<button class="btn" data-back="${esc(i.choreId+'|'+i.day)}">Вернуть</button>`:`<button class="btn no" data-rej="${esc(i.choreId+'|'+i.day)}">Отклонить</button>`}</div>`).join('')}).join('')||'<div class="empty">На этой неделе отметок пока нет.</div>'}
  <p class="lead" style="margin-top:24px">Точка • у дела значит, что ты его ещё не смотрела.</p>`;
 app.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{kid=b.dataset.kid;render()});
 const byKey=k=>list.find(i=>i.choreId+'|'+i.day===k);
 app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>review(byKey(b.dataset.rej).rows.filter(r=>r.done&&r.verdict!=='отклонено'),'отклонено','Отклонено'));
 app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>review(byKey(b.dataset.back).rows.filter(r=>r.verdict==='отклонено'),'ок','Засчитано снова'));
 const a=document.getElementById('all');
 if(a)a.onclick=()=>review(list.filter(i=>!i.rejected).flatMap(i=>i.rows.filter(r=>r.done&&!r.verdict)),'ок','Готово ✦');
}
async function review(rows,verdict,msg){
 if(!rows.length)return;
 rows.forEach(r=>r.verdict=verdict);render();   // сразу показываем, потом отправляем
 try{
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'review',key,items:rows.map(x=>({row:x.row,kid:x.kid,day:x.day,choreId:x.choreId,verdict}))})});
  const d=await r.json();if(d.error)throw new Error(d.error);
  toast(msg);
 }catch(e){toast('Не сохранилось, проверь интернет');load()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&key)load()});
load();
</script>
</body>
</html>
